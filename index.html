<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roleplay</title>
  <style>
    :root { color-scheme: dark; --bg:#111318; --panel:#1b1f27; --line:#303744; --text:#eef1f6; --muted:#9aa4b2; --accent:#8aa8ff; }
    * { box-sizing:border-box }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
    button,input,textarea { font:inherit }
    button { cursor:pointer; border:1px solid var(--line); color:var(--text); background:#252b36; border-radius:9px; padding:9px 12px; }
    button:hover { border-color:var(--accent) }
    button.primary { background:#526fca; border-color:#526fca }
    .app { display:grid; grid-template-columns:280px 1fr; min-height:100vh; max-width:1250px; margin:auto; }
    aside { border-right:1px solid var(--line); padding:18px; background:#15181e }
    h1 { font-size:20px; margin:0 0 18px }
    h2 { font-size:17px; margin:0 }
    .muted { color:var(--muted); font-size:13px }
    .row { display:flex; gap:8px; align-items:center }
    .between { justify-content:space-between }
    .full { width:100% }
    #chatList { display:grid; gap:7px; margin-top:14px }
    .chat-item { text-align:left; width:100%; background:transparent }
    .chat-item.active { border-color:var(--accent); background:#222b3d }
    main { display:flex; flex-direction:column; min-width:0; height:100vh }
    header { padding:17px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px }
    #messages { flex:1; overflow:auto; padding:22px; display:flex; flex-direction:column; gap:14px }
    .bubble { max-width:820px; width:fit-content; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--panel); white-space:pre-wrap; overflow-wrap:anywhere }
    .bubble.user { align-self:flex-end; background:#202a3b }
    .bubble .tools { display:flex; gap:6px; margin-top:9px }
    .bubble .tools button { font-size:12px; padding:5px 8px }
    .composer { border-top:1px solid var(--line); padding:16px 22px 20px }
    textarea { display:block; width:100%; min-height:85px; resize:vertical; background:#1b1f27; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px; }
    .composer .row { margin-top:9px; justify-content:space-between }
    .modal { position:fixed; inset:0; background:#0009; display:none; align-items:center; justify-content:center; padding:18px }
    .modal.open { display:flex }
    .dialog { width:min(560px,100%); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; display:grid; gap:12px }
    input { width:100%; background:#11151b; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px }
    .dialog textarea { min-height:120px }
    @media(max-width:700px) {
      .app { grid-template-columns:1fr; }
      aside { border-right:0; border-bottom:1px solid var(--line); padding:12px; }
      h1 { margin-bottom:9px }
      #chatList { display:flex; overflow-x:auto; }
      .chat-item { min-width:150px; width:auto }
      main { height:calc(100vh - 160px); min-height:450px }
      header { padding:12px 14px }
      #messages { padding:14px }
      .composer { padding:12px 14px }
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Roleplay</h1>
    <button class="primary full" id="newChat">+ Новый сюжет</button>
    <div class="muted" style="margin-top:18px">Мои чаты</div>
    <div id="chatList"></div>
    <p class="muted" style="margin-top:18px">История хранится в этом браузере на этом устройстве.</p>
  </aside>
  <main>
    <header>
      <div><h2 id="chatTitle">Новый сюжет</h2><div class="muted">Твой персонаж остаётся под твоим управлением</div></div>
      <button id="editScenario">Изменить сюжет</button>
    </header>
    <section id="messages">
      <div class="muted">Создай сюжет, напиши начало сцены и отправь первое сообщение.</div>
    </section>
    <section class="composer">
      <textarea id="prompt" placeholder="Напиши действие или реплику своего персонажа..."></textarea>
      <div class="row">
        <span class="muted" id="status">Готово</span>
        <button class="primary" id="send">Отправить</button>
      </div>
    </section>
  </main>
</div>
<div class="modal" id="modal">
  <div class="dialog">
    <h2 id="modalTitle">Новый сюжет</h2>
    <label>Название сюжета<input id="scenarioName" placeholder="Например: Тайна старого города"></label>
    <label>Описание и стартовая ситуация<textarea id="scenarioText" placeholder="Опиши мир, персонажей и начальную сцену..."></textarea></label>
    <div class="row" style="justify-content:flex-end"><button id="cancelModal">Отмена</button><button class="primary" id="saveScenario">Сохранить</button></div>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const key = 'roleplay_local_v1';
  let chats = JSON.parse(localStorage.getItem(key) || '[]');
  let activeId = chats[0]?.id || null;
  let editingScenario = false;
  const save = () => localStorage.setItem(key, JSON.stringify(chats));
  const active = () => chats.find(c => c.id === activeId);
  function renderList() {
    $('chatList').innerHTML = '';
    chats.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chat-item' + (c.id === activeId ? ' active' : '');
      b.textContent = c.name || 'Без названия';
      b.onclick = () => { activeId = c.id; render(); };
      $('chatList').append(b);
    });
  }
  function renderMessages() {
    const c = active();
    $('messages').innerHTML = '';
    if (!c) { $('messages').innerHTML = '<div class="muted">Нажми «Новый сюжет», чтобы начать.</div>'; return; }
    if (!c.messages.length) {
      const p = document.createElement('div'); p.className='muted'; p.textContent = c.scenario || 'Сюжет пока не описан.'; $('messages').append(p); return;
    }
    c.messages.forEach((m, i) => {
      const wrap = document.createElement('div'); wrap.className = 'bubble ' + m.role;
      const body = document.createElement('div'); body.textContent = m.text; wrap.append(body);
      const tools = document.createElement('div'); tools.className='tools';
      const edit = document.createElement('button'); edit.textContent='Изменить'; edit.onclick=()=>editMessage(i); tools.append(edit);
      if (m.role === 'assistant') {
        const regen = document.createElement('button'); regen.textContent='Повторить ответ'; regen.onclick=()=>regenerate(i); tools.append(regen);
      }
      wrap.append(tools); $('messages').append(wrap);
    });
    $('messages').scrollTop = $('messages').scrollHeight;
  }
  function render() {
    const c=active(); $('chatTitle').textContent=c?.name || 'Новый сюжет';
    renderList(); renderMessages();
  }
  function openModal(edit=false) {
    editingScenario=edit; const c=active();
    $('modalTitle').textContent=edit?'Изменить сюжет':'Новый сюжет';
    $('scenarioName').value=edit?(c?.name||''):'';
    $('scenarioText').value=edit?(c?.scenario||''):'';
    $('modal').classList.add('open');
  }
  $('newChat').onclick=()=>openModal(false);
  $('editScenario').onclick=()=>{ if(active()) openModal(true); };
  $('cancelModal').onclick=()=>$('modal').classList.remove('open');
  $('saveScenario').onclick=()=>{
    const name=$('scenarioName').value.trim() || 'Новый сюжет';
    const scenario=$('scenarioText').value.trim();
    if(editingScenario && active()) { active().name=name; active().scenario=scenario; }
    else { const c={id:crypto.randomUUID(),name,scenario,messages:[]}; chats.unshift(c); activeId=c.id; }
    save(); $('modal').classList.remove('open'); render();
  };
  function editMessage(i) {
    const c=active(), m=c.messages[i], value=prompt('Измени сообщение:',m.text);
    if(value!==null) { m.text=value; save(); renderMessages(); }
  }
  async function askAI() {
    const c=active(); if(!c) return;
    $('status').textContent='ИИ отвечает...'; $('send').disabled=true;
    try {
      const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        scenario:c.scenario, messages:c.messages.map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text}))
      })});
      if(!response.ok) throw new Error(await response.text() || 'API error');
      const data=await response.json();
      c.messages.push({role:'assistant',text:data.reply || 'Пустой ответ модели.'}); save(); renderMessages();
      $('status').textContent='Готово';
    } catch(e) {
      $('status').textContent='ИИ пока не подключён';
      alert('Сайт пока не подключён к ИИ. Для ответов нужно настроить сервер и API-ключ. Твои сообщения сохранены в этом браузере.');
    } finally { $('send').disabled=false; }
  }
  $('send').onclick=async()=>{
    const c=active(), text=$('prompt').value.trim(); if(!c || !text) return;
    c.messages.push({role:'user',text}); $('prompt').value=''; save(); renderMessages(); await askAI();
  };
  async function regenerate(i) {
    const c=active(); c.messages=c.messages.slice(0,i); save(); renderMessages(); await askAI();
  }
  $('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click();}});
  if(!activeId && chats.length) activeId=chats[0].id;
  render();
})();
</script>
</body>
</html>
